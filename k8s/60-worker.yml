apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ticketing
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: ticketing-service-account
      containers:
        - name: worker
          image: ghcr.io/kemilab/ticketing-worker:sha-1d48fad84563af43ffca61ab7277a9700e8020f5
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
