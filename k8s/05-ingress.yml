apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-ingress
  namespace: ticketing
spec:
  ingressClassName: nginx
  rules:
    - host: ticket.local
      http:
        paths:
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
